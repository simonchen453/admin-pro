version: '3.8'

services:
  # 后端服务
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: admin-pro-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      # Spring 配置
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      
      # 数据库配置（使用外部数据库）
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-adminpro}
      - DB_USERNAME=${DB_USERNAME:-adminpro}
      - DB_PASSWORD=${DB_PASSWORD:-password$1}
      - DB_USE_SSL=${DB_USE_SSL:-false}
      
      # 邮件配置（可选）
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      
      # 应用配置
      - APP_JDBC_SHOW_SQL=${APP_JDBC_SHOW_SQL:-false}
      - APP_CORS_ORIGINS=${APP_CORS_ORIGINS:-http://localhost:80,http://localhost:3000}
      - APP_SWAGGER_ENABLED=${APP_SWAGGER_ENABLED:-true}
      - APP_QUARTZ_STARTUP_DELAY=${APP_QUARTZ_STARTUP_DELAY:-5}
      
      # 管理端点配置
      - MANAGEMENT_SECURITY_ENABLED=${MANAGEMENT_SECURITY_ENABLED:-true}
      
      # 时区
      - TZ=Asia/Shanghai
    volumes:
      - ./logs:/app/logs
      - ./upload:/app/upload
    networks:
      - admin-pro-network
    extra_hosts:
      - "host.docker.internal:host-gateway"  # 允许访问宿主机服务（Mac/Windows）
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/adminpro/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # 前端服务
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: admin-pro-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - admin-pro-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/adminpro/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  admin-pro-network:
    driver: bridge
