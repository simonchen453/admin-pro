server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # ============================================
    # Admin Pro 前端应用（/adminpro/ 路径）
    # ============================================
    
    # Admin Pro 前端静态资源（JS、CSS、图片等）
    # Vite 构建时 base 是 /adminpro/，所以 HTML 中的资源路径是 /adminpro/assets/...
    # 但实际文件在 /usr/share/nginx/html/assets/...
    # 使用 alias 去掉 /adminpro 前缀
    location ~* ^/adminpro/(assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map))$ {
        alias /usr/share/nginx/html/$1;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Admin Pro 前端 SPA 路由支持
    location /adminpro/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /adminpro/index.html;
        add_header Cache-Control "no-cache";
    }
    
    # 处理 /adminpro 路径（不带尾部斜杠）的重定向
    location = /adminpro {
        return 301 /adminpro/;
    }

    # Admin Pro 健康检查
    location = /adminpro/health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ============================================
    # API 代理配置
    # ============================================
    
    # API 代理到后端（前端请求 /api，后端实际路径是 /adminpro）
    location ^~ /api {
        proxy_pass http://backend:8080/adminpro;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cookie 路径重写（后端返回的 Cookie Path 是 /adminpro，需要改为 /api）
        proxy_cookie_path /adminpro /api;
        
        # WebSocket 支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 文件上传大小限制
        client_max_body_size 100M;
    }

    # 后端 API 直接代理（用于 Swagger 等，通过 /adminpro/api 访问）
    location ^~ /adminpro/api {
        proxy_pass http://backend:8080/adminpro;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        client_max_body_size 100M;
    }

    # ============================================
    # 业务代码前端（根路径 /）
    # ============================================
    
    # 根路径默认返回 404 或业务代码的 index.html
    # 这里可以根据实际情况配置业务代码的路径
    # 例如：如果业务代码也在 Nginx 中，可以配置：
    # location / {
    #     root /usr/share/nginx/html/business;
    #     try_files $uri $uri/ /index.html;
    # }
    
    # 或者如果业务代码在另一个容器中，可以代理：
    # location / {
    #     proxy_pass http://business-frontend:80;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # 默认处理：返回 404（业务代码应该有自己的处理）
    location / {
        return 404;
    }
}
