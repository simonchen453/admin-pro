<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background: Purple Rounded Square -->
  <rect x="10" y="10" width="80" height="80" rx="20" fill="url(#grad)" />
  
  <!-- Icon: Diamond Shape -->
  <g transform="translate(50, 50) rotate(45)">
    <!-- Outer Diamond Outline -->
    <rect x="-20" y="-20" width="40" height="40" rx="4" fill="none" stroke="white" stroke-width="6" filter="url(#glow)" />
    
    <!-- Center Dot -->
    <circle cx="0" cy="0" r="6" fill="white" filter="url(#glow)" />
  </g>
</svg>
